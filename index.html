<script>
'use strict';
// Extract only explicitly named stages. Completing a stage does not imply passing it.
function noteStageEvents(note, applied, {includeCancelled=false}={}) {
  const events=[];
  const year=Number(String(applied||'').slice(0,4));
  for (const fragment of splitNoteFragments(note)) {
    const pattern=/AI\s*面(?:试)?|人工智能面试|测评|评测|笔试|HR\s*面(?:试)?|[一二三四五1-5]面/gi;
    const matches=[...fragment.matchAll(pattern)];
    for (let i=0;i<matches.length;i++) {
      const match=matches[i], before=fragment.slice(0,match.index), tail=fragment.slice(match.index+match[0].length,matches[i+1]?.index??fragment.length);
      if (/(?:无需|不用|没有|不需要|不参加|无)\s*$/.test(before)||!includeCancelled&&/^\s*[（(]?(?:取消|已取消)/.test(tail)) continue;
      let stage=match[0].replace(/\s+/g,'').replace(/评测/,'测评');
      if (/^ai|人工智能/i.test(stage)) stage='AI面';
      else if (/^hr/i.test(stage)) stage='HR面';
      else stage=stage.replace(/[1-5]/,d=>'一二三四五'[Number(d)-1]);
      const relevant=matches.length===1?fragment:match[0]+tail;
      let dateMatch=before.match(/(?:(20\d{2})[年./-])?(\d{1,2})[月./-](\d{1,2})(?!\d)(?:日|号)?/);
      if (!dateMatch&&matches.length===1) dateMatch=fragment.match(/(?:(20\d{2})[年./-])?(\d{1,2})[月./-](\d{1,2})(?!\d)(?:日|号)?/);
      if (!dateMatch) dateMatch=before.match(/(?<!\d)([1-9]|1[0-2])([0-3]\d)\s*$/);
      let when='';
      if (dateMatch) {
        const compact=dateMatch.length===3;
        const y=compact?year:Number(dateMatch[1]||year),m=Number(dateMatch[compact?1:2]),d=Number(dateMatch[compact?2:3]);
        const date=new Date(Date.UTC(y,m-1,d));
        if(y>=2000&&y<=2100&&date.getUTCFullYear()===y&&date.getUTCMonth()===m-1&&date.getUTCDate()===d){
          when=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          // A date without a stated time stays date-only; do not invent midnight.
          const time=fragment.match(/(上午|下午|晚上|中午)?\s*(\d{1,2})(?:[:：](\d{2})|点(?:(\d{1,2})分)?)/)||fragment.match(/(上午|下午|晚上|中午)\s*(\d{1,2})\.(\d{2})/);
          if(time){let h=Number(time[2]),min=Number(time[3]||time[4]||0);if(/下午|晚上|中午/.test(time[1]||'')&&h<12)h+=12;if(time[1]==='上午'&&h===12)h=0;if(h<24&&min<60)when+=`T${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;}
        }
      }
      const fail=/未通过|没过|不通过|挂了|淘汰/.test(relevant);
      const pass=!fail&&(/已通过|通过|已过/.test(relevant)||/(?:测评|评测|笔试|面试|面)过(?:了|$)/i.test(relevant));
      const abandoned=/放弃/.test(relevant)&&!/不放弃|未放弃/.test(relevant);
      const completed=abandoned||!/未做|未测|未面|没做|没面|还没|待做|待面/.test(relevant)&&(/已做|已测|已面|完成|结束|面过/.test(relevant)||fail||pass);
      events.push({stage,when,result:abandoned?'abandoned':fail?'fail':pass?'pass':'pending',handled:completed?'已处理':'',note:fragment});
    }
  }
  return events;
}

function backfillNoteHistory(data) {
  let added=0;
  for (const record of data.records) {
    const manualStages=new Set(record.entries.filter(e=>!e.inferredFromNote).map(e=>e.stage));
    const evidence=record.entries.filter(e=>!e.inferredFromNote).flatMap(e=>noteStageEvents(noteEvidence(e),record.base.applied));
    const newEntries=[];
    for (const event of evidence) {
      // Existing explicitly recorded stages take precedence; never overwrite user edits.
      if(manualStages.has(event.stage)) continue;
      const evidenceKey=event.stage+'|'+(event.when||event.note.replace(/\s/g,''));
      if([...record.entries,...newEntries].some(e=>e.noteEvidenceKey===evidenceKey || e.stage===event.stage&&event.when&&e.when===event.when))continue;
      let id='note_'+record.id+'_'+(record.entries.length+newEntries.length);
      while([...record.entries,...newEntries].some(e=>e.id===id))id+='x';
      newEntries.push({...event,id,performance:'',enteredAt:'',source:'备注补录',inferredFromNote:true,noteEvidenceKey:evidenceKey});
      added++;
    }
    newEntries.sort((a,b)=>(a.when||'9999').localeCompare(b.when||'9999'));
    record.entries.unshift(...newEntries);
  }
  return added;
}

// Keep the original evidence separate from the concise, editable display note.
function noteEvidence(entry) {
  return entry.note===entry.noteNormalized&&typeof entry.noteOriginal==='string'?entry.noteOriginal:entry.note||'';
}
function splitNoteFragments(note) {
  return String(note||'').split(/[,，;；\n。]+|\s*[-—–]\s*(?=20\d{2}[年./-]\d{1,2}[月./-]\d{1,2}|\d{1,2}[月./]\d{1,2}|[1-9]\d{2}(?=[^\d]))/).map(s=>s.trim()).filter(Boolean);
}
function normalizeNoteText(note,applied) {
  const progress=[],other=[];
  for(const fragment of splitNoteFragments(note)){
    let text=fragment.trim();
    const dateMatch=text.match(/^(?:(20\d{2})[年./-])?(\d{1,2})[月./-](\d{1,2})(?!\d)(?:日|号)?/)
      ||text.match(/^([1-9]|1[0-2])([0-3]\d)(?=\s*(?:ai|AI|笔试|测评|评测|[一二三四五1-5]面))/);
    if(!dateMatch){other.push(text);continue;}
    const compact=dateMatch.length===3;
    const year=compact?Number(String(applied||'').slice(0,4)):Number(dateMatch[1]||String(applied||'').slice(0,4));
    const month=Number(dateMatch[compact?1:2]),date=Number(dateMatch[compact?2:3]),check=new Date(Date.UTC(year,month-1,date));
    if(check.getUTCFullYear()!==year||check.getUTCMonth()!==month-1||check.getUTCDate()!==date){other.push(text);continue;}
    const prefix=(!compact&&dateMatch[1]?year+'.':'')+month+'.'+date;
    text=text.slice(dateMatch[0].length).trim();
    const stages=[...text.matchAll(/AI\s*面(?:试)?|人工智能面试|HR\s*面(?:试)?|测评|评测|笔试|[一二三四五1-5]面|面试/gi)];
    // Ambiguous or undated prose is retained, rather than assigning it to a stage.
    if(stages.length!==1){other.push(fragment);continue;}
    const match=stages[0];
    if(/(?:无需|不用|没有|不需要|不参加|无)\s*$/.test(text.slice(0,match.index))){other.push(prefix+text);continue;}
    let stage=match[0].replace(/\s/g,'').replace('评测','测评');

function supportsAbandonment(stage){return !isSingleStage(stage);}
function isAbandonedEntry(entry){return entry.result==='abandoned';}
function isClosedEntry(entry){return isFailedEntry(entry)||isAbandonedEntry(entry);}

// Migrate the old handling flag into a stage outcome. Keep the previous values
// for audit, and never invalidate a confirmed successful transition.
function normalizeAbandonedStages(data){
  let changed=0;
  for(const record of data.records)for(const entry of record.entries){
    if(entry.handled==='已放弃'&&supportsAbandonment(entry.stage)){
      entry.abandonmentResultBefore??=entry.result;
      entry.abandonmentHandledBefore??=entry.handled;
      if(record.entries.some(next=>next.previousEntryId===entry.id&&next.transitionKind==='advance')){
        entry.abandonmentWarning='旧记录在处理情况中标过放弃，但已有确认的后续流转，保留原阶段通过。请核对实际放弃的是哪个阶段。';
        entry.result='pass';
      }else{
        entry.result='abandoned';
        if(record.current===entry.id)record.currentManual=true;
      }
      clearChronologyResult(entry);entry.resultManual=true;entry.handled='已处理';changed++;
    }else if(isAbandonedEntry(entry)&&entry.handled!=='已处理'){
      entry.handled='已处理';changed++;
    }
  }
  return changed;
}

let pieSelection='', distributionMode='all', scheduleQuery='', scheduleCategory='activities';
const SCHEDULE_CATEGORIES=['面试','笔试','AI面','测评','其他进度'];

function latestDistribution(records) {
  const groups=new Map();
  for(const r of records){
    const label=statusText(current(r))||'未设置';
    if(!groups.has(label))groups.set(label,{label,records:[],count:0});
    const group=groups.get(label);group.records.push(r);group.count++;
  }
  return [...groups.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'zh-CN'));
}
function scheduleDate(value) {
  const match=String(value||'').trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if(!match)return null;
  const [,ys,ms,ds,hs,mins]=match,y=+ys,m=+ms,d=+ds,date=new Date(Date.UTC(y,m-1,d));
  if(y<2000||y>2100||date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)return null;
  return {date:`${ys}-${ms.padStart(2,'0')}-${ds.padStart(2,'0')}`,time:hs!==undefined&&+hs<24&&+mins<60?`${hs.padStart(2,'0')}:${mins}`:''};
}
function scheduleCategoryFor(stage) {
  if(stage==='AI面')return 'AI面';
  if(/面/.test(stage))return '面试';
  return ['笔试','测评'].includes(stage)?stage:'其他进度';
}
function scheduleEvents(records) {
  const events=[];
  for(const r of records)for(const e of r.entries){
    const explicit=scheduleDate(e.when),applied=scheduleDate(r.base.applied);
    const noteEvents=noteStageEvents(noteEvidence(e),r.base.applied,{includeCancelled:true}).filter(x=>x.stage===e.stage&&scheduleDate(x.when));
    // Prefer the recorded date. When it is missing, each dated occurrence in the
    // stage's own note remains an event (e.g. two written tests at one company).
    const dates=explicit?[{...explicit,source:e.inferredFromNote?'备注日期':'重要日期'}]
      :noteEvents.length?noteEvents.map(x=>({...scheduleDate(x.when),source:'备注日期',evidence:x}))
      :[{date:applied?.date||'',time:'',source:applied?'投递日期':'日期待补充'}];
    const seen=new Set();
    for(const item of dates){
      const key=item.date+'|'+item.time;if(seen.has(key))continue;seen.add(key);
      const note=item.evidence?.note||e.note||'';
      // A cancelled activity stays visible but must not look like an appointment.
      const fragments=String(note).split(/[,，;；\n。]+/);
      const cancelled=fragments.some(s=>s.toLowerCase().includes(e.stage.toLowerCase())&&/(?:已)?取消/.test(s));
      const handled=e.handled==='已放弃'?'已放弃':item.evidence?.handled||e.handled;
      events.push({r,e,date:item.date,time:item.time,source:item.source,
        category:scheduleCategoryFor(e.stage),note,cancelled,
        progress:e.result==='abandoned'||handled==='已放弃'?'已放弃':cancelled?'已取消':e.result==='fail'?'未通过':e.result==='pass'?'已通过':handled==='已处理'?'已处理':handled==='未处理'?'未处理':'未标记处理情况'});
    }
  }
  return events.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99')||String(a.r.base.company).localeCompare(String(b.r.base.company),'zh-CN'));
}
function partitionSchedule(events,today=day()) {
  return {past:events.filter(x=>x.date&&x.date<today),upcoming:events.filter(x=>x.date&&x.date>=today),undated:events.filter(x=>!x.date)};
}

$('#new').onclick=()=>newRecord();$('#export').onclick=exportBackup;$('#import').onclick=importData;$('#fields').onclick=showFields;$('#filter').onclick=showFilter;$('#sort').onclick=showSort;$('#undo').onclick=undo;$('#help').onclick=help;$('#rulesHelp').onclick=showWorkflowRules;$('#csvExport').onclick=exportCSV;$('#sidebarToggle').onclick=()=>{setSidebarOpen(!isSidebarOpen());if(isSidebarOpen())$('#sidebarFold').focus()};$('#sidebarFold').onclick=()=>{setSidebarOpen(false);$('#sidebarToggle').focus()};$('#search').oninput=ev=>{query=ev.target.value;selected.clear();renderTable()};$('#collapse').onclick=()=>{if(view.stage){collapsed.has(view.stage)?collapsed.delete(view.stage):collapsed.add(view.stage)}else{if(topViews().every(s=>collapsed.has(s)))collapsed.clear();else collapsed=new Set(topViews())}renderTable()};
$('#grid').addEventListener('click',ev=>{const b=ev.target.closest('button'),td=ev.target.closest('td[data-field]');if(b?.dataset.detail)return showDetail(b.dataset.detail);if(b?.dataset.addStage)return newRecord(defaultStage(b.dataset.addStage));const groupKey=ev.target.closest('[data-group-toggle]')?.dataset.groupToggle,subKey=ev.target.closest('[data-sub-group-toggle]')?.dataset.subGroupToggle;if(groupKey){collapsed.has(groupKey)?collapsed.delete(groupKey):collapsed.add(groupKey);renderTable();if(b?.dataset.toggle)$$('[data-toggle]').find(x=>x.dataset.toggle===groupKey)?.focus({preventScroll:true});return}if(subKey){subCollapsed.has(subKey)?subCollapsed.delete(subKey):subCollapsed.add(subKey);renderTable();if(b?.dataset.subToggle)$$('[data-sub-toggle]').find(x=>x.dataset.subToggle===subKey)?.focus({preventScroll:true});return}if(b?.dataset.editLink)return editCell(td);if(ev.target.id==='selectAll'){for(const {r,e} of pairs()){const k=r.id+'|'+e.id;ev.target.checked?selected.add(k):selected.delete(k)}return renderTable()}if(ev.target.dataset.check){ev.target.checked?selected.add(ev.target.dataset.check):selected.delete(ev.target.dataset.check);ev.target.closest('tr').classList.toggle('selected',ev.target.checked);return renderBulk()}const th=ev.target.closest('th[data-col]');if(th&&!ev.target.dataset.resize){sort={key:th.dataset.col,dir:sort.key===th.dataset.col?-sort.dir:1};return renderTable()}if(td&&['status','latest','select','multiselect'].includes(state.fields.find(f=>f.key===td.dataset.field)?.type))editCell(td)});

$('#grid').addEventListener('pointerdown',ev=>{const key=ev.target.dataset.resize;if(!key)return;ev.preventDefault();ev.stopPropagation();const f=state.fields.find(f=>f.key===key),start=ev.clientX,width=f.width,cols=$$('#grid col'),index=state.fields.filter(f=>!f.hidden).findIndex(f=>f.key===key)+1;let w=width;const move=e=>{w=Math.max(85,Math.min(600,width+e.clientX-start));cols[index].style.width=w+'px';$('#grid').style.width=(44+state.fields.filter(f=>!f.hidden).reduce((n,x)=>n+(x.key===key?w:x.width),0))+'px'};const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);mutate(()=>f.width=w)};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)});
$('#bulk').onclick=ev=>{const action=ev.target.dataset.bulk;if(!action)return;const ps=pairs().filter(({r,e})=>selected.has(r.id+'|'+e.id));if(action==='clear'){selected.clear();return renderTable()}if(action==='delete')return confirmDelete([...new Set(ps.map(x=>x.r.id))]);const targets=action==='handled'?ps:ps.filter(({e})=>!isSingleStage(entryStatusStage(e)));mutate(()=>targets.forEach(({r,e})=>{if(action==='handled')e.handled='已处理';else{if(r.chronologyCurrentAuto||r.current===e.id&&action==='abandoned')r.currentManual=true;setManualStageResult(e,action,e.handled)}}),'已批量更新 '+targets.length+' 条记录')};

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();closeEditor();closeMobileSidebar()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!ev.target.matches('input,textarea,select,[contenteditable]')){ev.preventDefault();undo()}if(ev.key==='Tab'&&$('.modal')){const nodes=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]',$('.modal')).filter(e=>e.getClientRects().length);if(ev.shiftKey&&document.activeElement===nodes[0]){ev.preventDefault();nodes.at(-1)?.focus()}else if(!ev.shiftKey&&document.activeElement===nodes.at(-1)){ev.preventDefault();nodes[0]?.focus()}}});

else if(loadError){persist();notify(loadError);}
else{
  try{if(changed||!localStorage.getItem(KEY))persist();}catch{persist();}
  if(supplemented)notify('已补录 '+supplemented+' 条阶段记录，并按明确日期核对进度');
